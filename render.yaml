# Render Blueprint for STEMWISE (https://render.com).
# Deploys the NestJS API from backend/Dockerfile. MongoDB is NOT hosted on
# Render — create a free MongoDB Atlas cluster and set DATABASE_URL below.
#
# In the Render dashboard: New + → Blueprint → pick your repo → it reads this file.
services:
  - type: web
    name: stemwise-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon            # change if you prefer (frankfurt, singapore, ...)
    healthCheckPath: /api/v1/health
    autoDeploy: true          # redeploys on every push to the connected branch
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app already reads process.env.PORT.
      - key: JWT_ACCESS_SECRET
        generateValue: true   # Render generates a strong secret
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set these two yourself in the dashboard (sync:false = not stored in git):
      - key: DATABASE_URL
        sync: false           # e.g. mongodb+srv://user:pass@cluster0.xxxx.mongodb.net/stemwise
      - key: CORS_ORIGIN
        sync: false           # your frontend origin, e.g. https://stemwise-web.onrender.com
